<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato - Delicatto Pet Shop</title>
    <link rel="stylesheet" href="../css/estilo.css"> 
</head>
<body>
    <h1 id="titulo">Delicatto Pet Shop</h1>
    <div class="menu">
        <a href="arquivo.html">Home</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </div>
    <div class="formulario">
        <h2>Entre em contato conosco</h2>
        <form>
            <p>Nome:</p>
            <input type="text">
            <p>Email:</p>
            <input type="email">
            <p>Data desejada:</p>
            <input type="data">
            <p>Serviço desejado:</p>
            <select>
                <option>Banho</option>
                <option>Tosa</option>
                <option>Consulta Veterinária</option>
                <option>Hospedagem</option>
            </select>
            <p>Mensagem:</p>
            <textarea rows="5" cols="40"></textarea>
            <br><br>
            <button type="submit">
                Enviar
            </button>

        </form>

    </div>
</body>
</html>
